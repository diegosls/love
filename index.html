<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nossa Máquina do Tempo</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Cinzel:wght@400;700&family=Rajdhani:wght@300;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
</head>

<body>

<canvas id="stars"></canvas>

<section class="intro watch">
<h1 id="glitch-text">Nossa Máquina do Tempo</h1>

</section>

<section class="timer watch">
  <div class="timer-box">
    <p>Estamos juntos há</p>
    <h2 id="counter">...</h2>
  </div>
</section>


<!-- CARROSSEL -->
<section class="carousel-section watch">

  <div class="carousel-header">
    <h3>nossos momentos</h3>
    <div class="line"></div>
  </div>

  <div class="carousel">
    <div class="carousel-track">

      <div class="slide active">
        <img src="image/1.jpeg" alt="">
        <div class="caption">
          <span>25 de janeiro de 2026</span>
        </div>
      </div>

      <div class="slide">
        <img src="image/2.jpeg" alt="">
        <div class="caption">
          <span>01 de fevereiro de 2026</span>
        </div>
      </div>

      <div class="slide">
        <img src="image/3.jpeg" alt="">
        <div class="caption">
          <span>15 de fevereiro de 2026</span>
        </div>
      </div>

      <div class="slide">
        <img src="image/4.jpeg" alt="">
        <div class="caption">
          <span>17 de fevereiro de 2026</span>
        </div>
      </div>

      <div class="slide">
        <img src="image/5.jpeg" alt="">
        <div class="caption">
          <span>28 de fevereiro de 2026</span>
        </div>
      </div>

      <div class="slide">
        <img src="image/6.jpeg" alt="">
        <div class="caption">
          <span>09 de março de 2026</span>
        </div>
      </div>

      <div class="slide">
        <img src="image/7.jpeg" alt="">
        <div class="caption">
          <span>22 de  de 2026</span>
        </div>
      </div>

    </div>


  </div>

</section>
<section class="music-section watch">
  <div class="music-box">
    <h2>Nossa Música</h2>
    <iframe style="border-radius: 12px;" src="https://open.spotify.com/embed/track/72YndtlfHyl5Z5NE2qikkU"
      width="100%" height="352" frameborder="0"></iframe>
  </div>
</section>

<section class="typing-section watch" id="typing-section-2">
  <p id="typing-text-2"></p>
</section>

<section class="video-section watch">
  <div class="video-box">
    <div class="video-container">
      <video controls>
        <source src="video/video.mp4" type="video/mp4">
      </video>
    </div>

  </div>

</section>


<section id="typing-section" class="typing-section watch">
  <p id="typing-text"></p>
</section>

<section class="outro watch">
  <p><strong>EU TE AMO A CADA DIA MAIS, SOPHIA!</strong></p>
</section>

<script src="main.js"></script>
</body>
</html>
